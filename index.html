<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<title>Diyet Takip</title>
<style>
:root{color-scheme:light dark;--page:#f9f9f7;--surface:#fff;--ink:#0b0b0b;--ink2:#52514e;--mut:#898781;--line:#e1e0d9;--axis:#c3c2b7;
  --acc:#2a78d6;--acc-btn:#256abf;--on-acc:#fff;--soft:#e2edfb;--good:#006300;--bad:#b3261e;--ring:rgba(11,11,11,.10);
  --shadow:0 1px 2px rgba(11,11,11,.04),0 6px 20px rgba(11,11,11,.05)}
@media(prefers-color-scheme:dark){:root{--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--line:#2c2c2a;--axis:#383835;
  --acc:#3987e5;--acc-btn:#3987e5;--on-acc:#0b0b0b;--soft:#16294a;--good:#0ca30c;--bad:#e66767;--ring:rgba(255,255,255,.10);--shadow:none}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:sticky;top:0;z-index:3;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:720px;margin:0 auto}
h1{font-size:1.35rem;font-weight:700;letter-spacing:-.02em;margin:0}
#sync{font-size:.75rem;color:var(--ink2);min-height:1.1em}
.pill{border:1px solid var(--ring);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:.85rem;font-weight:600}
.week{display:flex;gap:4px;max-width:720px;margin:10px auto 0;align-items:stretch}
.week button{flex:1;border:0;background:none;border-radius:14px;padding:6px 0;display:grid;justify-items:center;gap:1px;min-height:58px}
.week .arr{flex:0 0 28px;font-size:1.3rem;color:var(--ink2)}
.week span{font-size:.7rem;color:var(--ink2)}
.week b{font-size:1.05rem;font-weight:650}
.week i{width:5px;height:5px;border-radius:50%}
.week i.dot{background:var(--acc)}
.week .now b{color:var(--acc-btn)}
.week .on{background:var(--acc-btn)}
.week .on span,.week .on b{color:var(--on-acc)}
.week .on i.dot{background:var(--on-acc)}
main{max-width:720px;margin:0 auto;padding:8px 16px calc(96px + env(safe-area-inset-bottom))}
section{background:var(--surface);border:1px solid var(--ring);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
h2{font-size:1.05rem;font-weight:650;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-size:.8rem;font-weight:400;color:var(--ink2)}
p{margin:8px 0 0}
.mut{color:var(--ink2);font-size:.85rem}
.hero{display:flex;gap:16px;align-items:center}
.ringbox{position:relative;flex:0 0 150px;height:150px}
.ringbox svg{width:150px;height:150px;transform:rotate(-90deg)}
.ringbox .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringbox .n{font-size:40px;font-weight:700;line-height:1;letter-spacing:-.03em}
.ringbox .u{font-size:.8rem;color:var(--ink2);margin-top:4px}
.stats{flex:1;min-width:0;display:grid;gap:14px}
.stat .l{font-size:.8rem;color:var(--ink2)}
.stat .v{font-weight:650;margin-bottom:5px}
.stat .v small{font-weight:400;color:var(--ink2);font-size:.85rem}
.meter{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.water{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:6px}
.water button{height:32px;padding:0;border:0;border-radius:4px;background:var(--soft)}
.water .full{background:var(--acc)}
.kt{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;font-size:.9rem}
.sep{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles.two{grid-template-columns:repeat(2,1fr)}
.tiles label{font-size:.75rem;color:var(--ink2);display:grid;gap:4px;text-align:center}
.tiles input{width:100%;text-align:center;font-size:1.2rem;font-weight:650;color:var(--ink);background:var(--page);border:1px solid var(--ring);border-radius:12px;padding:10px 4px}
.tile{background:var(--page);border:1px solid var(--ring);border-radius:14px;padding:12px}
.tile .l{font-size:.78rem;color:var(--ink2)}
.tile .v{font-size:1.45rem;font-weight:650;letter-spacing:-.02em}
.tile .s{font-size:.78rem;color:var(--ink2)}
.tile .s.good{color:var(--good)}.tile .s.bad{color:var(--bad)}
a{color:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap}
.field{background:var(--page);border:1px solid var(--ring);border-radius:12px;padding:10px 12px;min-width:0}
textarea.field{width:100%;resize:vertical;line-height:1.5}
.btn{border:1px solid var(--ring);background:var(--page);border-radius:12px;padding:10px 14px;font-weight:600}
.btn.pri{background:var(--acc-btn);color:var(--on-acc);border-color:transparent}
.btn.big{width:100%;padding:14px;font-size:1.05rem;border-radius:14px;margin-top:14px}
.btn.done{background:var(--page);color:var(--good);border:1px solid var(--ring)}
.btn.x{padding:4px 10px;border-radius:99px;font-weight:400}
ul,ol{margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.moves{counter-reset:m;margin-top:12px}
.moves li{counter-increment:m;display:flex;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.moves li::before{content:counter(m);flex:0 0 24px;height:24px;border-radius:50%;background:var(--soft);font-size:.75rem;font-weight:650;display:grid;place-content:center}
.sched li{display:flex;align-items:center;gap:10px;padding:5px 0}
.sched span{flex:0 0 88px;color:var(--ink2);font-size:.9rem}
.sched select{flex:1}
details{border-top:1px solid var(--line);padding:12px 0}
summary{font-weight:600;cursor:pointer}
details label{display:grid;gap:4px;font-size:.78rem;color:var(--ink2);margin-top:10px}
details label>*{color:var(--ink);font-size:1rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--ink2);margin-bottom:8px}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;top:6px;width:156px;background:var(--surface);border:1px solid var(--ring);border-radius:10px;padding:8px 10px;font-size:.78rem;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.15)}
table{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums;margin-top:8px}
th,td{text-align:right;padding:6px 4px;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--ink2);font-weight:500}
pre{white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,monospace;background:var(--page);border:1px solid var(--ring);border-radius:12px;padding:10px;margin:10px 0 0;max-height:220px;overflow:auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:center;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:160px;border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:.72rem;color:var(--ink2);padding:6px 0;border-radius:12px}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--acc-btn);font-weight:650}
@media(max-width:350px){.ringbox{flex-basis:120px;height:120px}.ringbox svg{width:120px;height:120px}.ringbox .n{font-size:32px}}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div><h1 id="title"></h1><div id="sync" role="status"></div></div>
    <button id="today" class="pill" hidden>Bugüne dön</button>
  </div>
  <div class="week" id="week"></div>
</header>
<main id="app"></main>
<nav id="tabs" aria-label="Bölümler"></nav>
<script>
const BIN = '6afc10dbac6210605a8e1a08', API = () => 'https://api.jsonbin.io/v3/b/' + (localStorage.diyetBin || BIN);
// Varsayılan hedefler; Ayarlar'dan değiştirilince S.cfg içinde saklanır ve cihazlar arasında eşitlenir.
const DEF_C = {kcal: 2000, p: 140, su: 3000, adim: 8000, start: '2026-11-15', startKg: 96, goal: '2027-05-15', goalKg: 82, son: '19:30'};
const C = {...DEF_C};
const TR = 'tr-TR';

// Düzen: 2 ana öğün (kahvaltı ~600, ana öğün ~800 kcal) ve 2 ara öğün (~300 kcal). Toplam yaklaşık 2.000 kcal, 140 g protein.
const ARA = [
  {id: 'a1', ad: 'Elma, süzme yoğurt, ceviz', ne: '1 elma, 200 g süzme yoğurt, 3 ceviz', kcal: 290, p: 19, f: ['6/6f', 'Jazz_apples_with_yoghurt_15-02-2026.jpg']},
  {id: 'a2', ad: 'Peynirli sandviç ve ayran', ne: '2 dilim tam buğday ekmek, 40 g beyaz peynir, domates, 200 ml ayran', kcal: 330, p: 17, f: ['a/a0', 'Ayran_%28large_glass%29.jpg']},
  {id: 'a3', ad: 'Haşlanmış yumurta', ne: '3 yumurta, 1 dilim ekmek, salatalık', kcal: 300, p: 21, f: ['a/a4', 'Boiled_Egg_-_Crossection.jpg']},
  {id: 'a4', ad: 'Süzme yoğurt ve meyve', ne: '300 g süzme yoğurt, 1 avuç çilek ya da başka meyve', kcal: 300, p: 27, f: ['b/b1', 'Strawberries_%26_Yogurt.jpg']},
  {id: 'a5', ad: 'Lor ve muz', ne: '200 g lor, 1 muz, tarçın', kcal: 280, p: 27, f: ['d/d1', 'Yogurt_fruit_bowl.jpg']},
  {id: 'a6', ad: 'Ton balıklı sandviç', ne: '1 kutu ton (süzülmüş), 2 dilim tam buğday ekmek, yeşillik', kcal: 270, p: 31, f: ['7/74', 'Tunafish_and_Emmenthaler_cheese_sandwich_with_tomato_and_black_pepper_on_multigrain_toast_-_Massachusetts.jpg']},
  {id: 'a7', ad: 'Küçük tavuk dürüm', ne: '1 lavaş, 80 g ızgara tavuk, yeşillik, 1 yemek kaşığı yoğurt', kcal: 300, p: 30, f: ['5/5d', 'Handmade_Chicken_Shawarma_Wrap_-_Lavash.jpg']},
  {id: 'a8', ad: 'Yulaf ve yoğurt', ne: '40 g yulaf, 200 g yoğurt, yarım muz, tarçın', kcal: 320, p: 13, f: ['5/59', 'Cereal%2C_Yoghurt%2C_Berries_%26_Apple_%284380985577%29.jpg']}
];
const MEALS = [
  {k: 'kahvalti', ad: 'Kahvaltı', ops: [
    {id: 'k1', ad: 'Klasik kahvaltı', ne: '3 yumurta, 60 g beyaz peynir, 2 dilim tam buğday ekmek, domates-salatalık, 8 zeytin', kcal: 600, p: 35, f: ['0/0e', 'Turkish_breakfast_%2820658662572%29.jpg']},
    {id: 'k2', ad: 'Menemen', ne: '3 yumurtalı menemen, 60 g peynir, 2 dilim ekmek', kcal: 600, p: 34, f: ['e/e7', 'Turkish_egg_dish_Menemen.jpg']},
    {id: 'k3', ad: 'Yulaf kâsesi', ne: '70 g yulaf, 300 g süzme yoğurt, 1 muz, 2 ceviz, tarçın', kcal: 610, p: 38, f: ['1/1f', 'Banana_Oatmeal_Breakfast_Bowl_%2844302857265%29.jpg']},
    {id: 'k4', ad: 'Omlet ve lor', ne: '3 yumurtalı omlet, 150 g lor, 2 dilim ekmek, yeşillik', kcal: 550, p: 45, f: ['5/50', 'Omelette_on_a_plate.jpg']}]},
  {k: 'ara1', ad: 'Ara öğün 1', ops: ARA},
  {k: 'ara2', ad: 'Ara öğün 2', ops: ARA},
  {k: 'ana', ad: 'Ana öğün', ops: [
    {id: 'o1', ad: 'Tavuk ve pilav', ne: '200 g ızgara tavuk, 8 yemek kaşığı pilav, salata (1 yemek kaşığı zeytinyağı), 200 g yoğurt', kcal: 800, p: 72, f: ['d/de', 'Chiken_Steaks_in_Pakistan.jpg']},
    {id: 'o2', ad: 'Köfte ve makarna', ne: '200 g ızgara köfte, 6 yemek kaşığı makarna, salata, ayran', kcal: 820, p: 52, f: ['2/22', 'Kofte_and_Pilav.jpg']},
    {id: 'x2', ad: 'Izgara köfte ve pilav', ne: '200 g ızgara köfte, 6 yemek kaşığı pilav, bol salata, ayran', kcal: 820, p: 48, f: ['d/d2', 'Izgara_k%C3%B6fte.jpg']},
    {id: 'x1', ad: 'Tavuk ve çorba', ne: '200 g ızgara tavuk, 1 kâse mercimek çorbası, 2 dilim ekmek, salata (1 yemek kaşığı zeytinyağı)', kcal: 750, p: 78, f: ['6/65', 'Mercimek_%C3%A7orbasi.jpg']},
    {id: 'x3', ad: 'Izgara balık', ne: '220 g ızgara somon ya da levrek, 2 orta haşlanmış patates, salata (1 yemek kaşığı zeytinyağı)', kcal: 750, p: 50, f: ['f/fb', 'Grilled_salmon_garnished_with_lemon_and_parsley.jpg']},
    {id: 'x4', ad: 'Et sote', ne: '200 g et sote ya da bonfile, 6 yemek kaşığı bulgur pilavı, ızgara sebze, 150 g yoğurt', kcal: 760, p: 60, f: ['2/26', 'Bosphorus_kebab.jpg']},
    {id: 'o4', ad: 'Kuru fasulye', ne: '1,5 porsiyon etli kuru fasulye, 6 yemek kaşığı bulgur, cacık', kcal: 740, p: 42, f: ['3/35', 'Kuru_Fasulye_pilav.jpg']},
    {id: 'o3', ad: 'Ton balıklı salata', ne: '2 kutu ton (süzülmüş), bol salata, 1 haşlanmış yumurta, 2 dilim ekmek, 1 yemek kaşığı zeytinyağı, 200 g yoğurt', kcal: 700, p: 68, f: ['c/c8', 'Veggie%2BTuna_salad.jpg']},
    {id: 'o5', ad: 'Tavuk döner (dışarıda)', ne: 'Porsiyon tavuk döner, pilav, salata, ayran. Dürüm değil.', kcal: 720, p: 48, f: ['a/aa', 'Tavuk_doner.jpg']},
    {id: 'x5', ad: 'Tavuk şiş (dışarıda)', ne: 'Porsiyon tavuk şiş, pilav, salata, ayran. Ekmek sepeti yok.', kcal: 730, p: 66, f: ['4/4d', '%C5%9Ei%C5%9F_tavuk_%28or_tavuk_%C5%9Fi%C5%9F%29.jpg']}]}
];

// Varsayılan program; uygulamadan düzenlenince S.plan olarak kaydedilir.
const DEF_PLAN = {
  hafta: ['yok', 'gogus', 'sirt', 'kardiyo', 'omuz', 'yok', 'kardiyo'], // pazar=0
  spor: {
    gogus: {ad: 'Göğüs ve arka kol', h: ['Chest press', 'Incline / decline press', 'Sıkıştırma', 'Arka kol superset', 'Triceps kickback', 'Eğimli yürüyüş 15-20 dk']},
    sirt: {ad: 'Sırt ve ön kol', h: ['Lat pulldown', 'Seated row', 'İple yukarıdan kanada çekiş (cable)', 'Biceps 7-7-7', 'Yandan ön kol (hammer curl)', 'Eğimli yürüyüş 15-20 dk']},
    omuz: {ad: 'Omuz ve bacak', h: ['Omuz superset 1', 'Omuz superset 2', 'Leg press', 'Leg curl', 'Leg extension', 'Eğimli yürüyüş 15-20 dk']},
    kardiyo: {ad: 'Kardiyo', h: ['40-45 dk eğimli yürüyüş (eğim 8-10, hız 5-5,5)']},
    yok: {ad: 'Dinlenme', h: ['Hedef 7-8 bin adım']}
  }
};
const GUNLER = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];

const OPS = Object.fromEntries(MEALS.flatMap(m => m.ops.map(o => [o.id, o])));
console.assert(Object.keys(OPS).length === 22, 'öğün kimlikleri benzersiz olmalı');
const iso = d => d.toLocaleDateString('sv');
const dateOf = s => new Date(s + 'T12:00');
const addDays = (s, n) => { const d = dateOf(s); d.setDate(d.getDate() + n); return iso(d); };
const monday = s => addDays(s, -((dateOf(s).getDay() + 6) % 7));
const fmt = (n, d = 1) => n.toLocaleString(TR, {minimumFractionDigits: d, maximumFractionDigits: d});
const mean = a => a.length ? a.reduce((x, y) => x + y) / a.length : null;
const totals = day => {
  const xs = [...Object.values(day.meals || {}).map(id => OPS[id]).filter(Boolean), ...(day.extra || [])];
  return {kcal: xs.reduce((s, x) => s + (+x.kcal || 0), 0), p: xs.reduce((s, x) => s + (+x.p || 0), 0)};
};
const avg7 = (days, date) => {
  const v = []; for (let i = 0; i < 7; i++) { const kg = days[addDays(date, -i)]?.kg; if (kg) v.push(+kg); }
  return mean(v);
};
// Öğün saatleri kahvaltıya göre kayar; ana öğün en geç 19:30, ara öğünler ikisinin arasına eşit dağılır.
const hm = s => +s.slice(0, 2) * 60 + +s.slice(3), toHM = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const saatler = kt => {
  const b = hm(kt), d = Math.max(Math.min(b + 510, hm(C.son)), b + 240), at = f => toHM(Math.round((b + (d - b) * f) / 15) * 15);
  return {kahvalti: kt, ara1: at(1 / 3), ara2: at(2 / 3), ana: at(1)};
};
const T0 = () => +dateOf(C.start), T1 = () => +dateOf(C.goal);
const planKg = t => C.startKg + (C.goalKg - C.startKg) * Math.min(1, Math.max(0, (+dateOf(t) - T0()) / (T1() - T0())));
const newer = (a, b) => ((a?.at || 0) >= (b?.at || 0) ? a : b) || undefined;
console.assert(totals({meals: {a: 'k1', b: 'o1'}, extra: [{kcal: 100, p: 5}]}).kcal === 1500, 'totals');
console.assert(avg7({'2026-01-07': {kg: 90}, '2026-01-05': {kg: 92}, '2025-12-31': {kg: 99}}, '2026-01-07') === 91, 'avg7');
console.assert(addDays('2026-12-31', 1) === '2027-01-01' && monday('2026-11-15') === '2026-11-09', 'tarih');
console.assert(planKg(C.start) === C.startKg && planKg(C.goal) === C.goalKg, 'planKg');
console.assert(JSON.stringify(saatler('10:00')) === '{"kahvalti":"10:00","ara1":"12:45","ara2":"15:45","ana":"18:30"}' && JSON.stringify(saatler('12:00')) === '{"kahvalti":"12:00","ara1":"14:30","ara2":"17:00","ana":"19:30"}', 'saatler');
console.assert(newer({at: 2}, {at: 5}).at === 5 && newer(undefined, {at: 1}).at === 1, 'newer');
const sayi = s => { const n = parseFloat(String(s).trim().replace(',', '.')); return n >= 0 ? n : null; };
console.assert(sayi('95,4') === 95.4 && sayi('95.4') === 95.4 && sayi(' 8000 ') === 8000 && sayi('') === null && sayi('abc') === null, 'sayi');

const TODAY = iso(new Date());
const $ = id => document.getElementById(id);
let S = {days: {}}, cur = TODAY, tab = 'bugun', openId = null, timer;
try { S = JSON.parse(localStorage.diyet) || S; } catch {}
S.days ||= {};
const applyCfg = () => Object.assign(C, DEF_C, S.cfg);
applyCfg();
const D = () => S.days[cur] || {};
const set = fn => { fn(S.days[cur] ||= {}); save(); };
const plan = () => S.plan || DEF_PLAN;
// O gün girilmediyse en son girilen kahvaltı saati geçerli olur.
const ktOf = () => D().kt || S.days[Object.keys(S.days).filter(t => t < cur && S.days[t].kt).sort().at(-1)]?.kt || '10:00';
const editPlan = fn => { S.plan ||= structuredClone(DEF_PLAN); fn(S.plan); S.plan.at = Date.now(); save(); };
const status = t => $('sync').textContent = t;

function save() {
  localStorage.diyet = JSON.stringify(S); localStorage.diyetDirty = '1';
  clearTimeout(timer); timer = setTimeout(push, 1500);
}
function merge(remote, localWins) {
  if (!remote?.days) return;
  // Yalnızca bu cihazda olan günler asla silinmez; aynı gün iki yerde varsa localWins belirler.
  S.days = localWins ? {...remote.days, ...S.days} : {...S.days, ...remote.days};
  S.plan = newer(S.plan, remote.plan);
  S.cfg = newer(S.cfg, remote.cfg); applyCfg();
}

// Fotoğraf en fazla 1024 px JPEG'e küçültülür: istek küçük kalır, telefon fotoğrafı 20 MB sınırına takılmaz.
async function kucult(file) {
  const bmp = await createImageBitmap(file), k = Math.min(1, 1024 / Math.max(bmp.width, bmp.height));
  const c = Object.assign(document.createElement('canvas'), {width: bmp.width * k, height: bmp.height * k});

const gemParse = j => {
  const xs = [];
  (function walk(o) { if (!o || typeof o !== 'object' || o.thought) return; for (const [k, v] of Object.entries(o)) typeof v === 'string' ? /text/i.test(k) && xs.push(v) : walk(v); })(j);

  }

};

const gemFetch = async (path, body, extra) => {
  const r = await fetch('https://generativelanguage.googleapis.com/' + path, {method: body ? 'POST' : 'GET',
    headers: {'x-goog-api-key': localStorage.diyetGem, ...(body && {'Content-Type': 'application/json'}), ...extra}, body: body && JSON.stringify(body)});

// Model adına göre gürültü ayıklanır; hangi API'nin çalıştığı çağrı sırasında denenerek bulunur.
async function gemModeller() {
  const out = []; let err;
  for (const ver of ['v1beta', 'v1alpha', 'v1']) {
    try {
      for (const m of (await gemFetch(ver + '/models?pageSize=1000')).models || []) {
        const id = String(m.name).replace('models/', '');
        if (/gemini|gemma/.test(id) && !/embed|tts|audio|image|live|robotics|computer/.test(id) && !out.some(x => x.id === id)) out.push({id, ver, ad: m.displayName || id});
      }
    } catch (e) { err ||= e; }
  }
  if (!out.length) throw err || new Error('model bulunamadı');
  return out;
}
// Modeller aynı API'yi desteklemiyor: sırayla şemalı generateContent, şemasız generateContent ve Interactions API denenir.
async function gemini(text, file) {
  const soru = 'Diyetisyen gibi davran. Kullanıcının yediği şeyin TOPLAM kalorisini (kcal) ve proteinini (gram) tahmin et. Porsiyon belirtilmediyse fotoğraftan ya da standart Türk porsiyonundan tahmin et; emin değilsen biraz yüksek tarafı seç. Yiyecek yoksa kcal 0 ver. Yalnızca şu biçimde JSON döndür: {"ad": "kısa Türkçe ad ve porsiyon, örnek: İskender, 1 porsiyon", "kcal": tam sayı, "p": tam sayı}\n\nKullanıcı: ' + (text || '(fotoğrafa bak)');
  const img = file && await kucult(file);
  const sema = up => { const T = x => up ? x.toUpperCase() : x; return {type: T('object'), properties: {ad: {type: T('string')}, kcal: {type: T('integer')}, p: {type: T('integer')}}, required: ['ad', 'kcal', 'p']}; };
  const dene = async ({id, ver}) => {
    const gc = cfg => () => gemFetch(`${ver}/models/${encodeURIComponent(id)}:generateContent`, {contents: [{parts: [{text: soru}, ...(img ? [{inline_data: {mime_type: 'image/jpeg', data: img}}] : [])]}], ...cfg});
    const yollar = [
      ['generateContent', gc({generationConfig: {responseMimeType: 'application/json', responseSchema: sema(true)}})],
      ['generateContent, şemasız', gc({})],
      ['interactions', () => gemFetch('v1beta/interactions', {model: id, input: [{type: 'text', text: soru}, ...(img ? [{type: 'image', data: img, mime_type: 'image/jpeg'}] : [])],
        response_format: {type: 'text', mime_type: 'application/json', schema: sema(false)}}, {'Api-Revision': '2026-05-20'})]];
    const hata = []; let anahtar = false;
    for (const [ad, f] of yollar) {
      try { return gemParse(await f()); }
      catch (e) {
        hata.push(ad + ': ' + (e.message || e));
        anahtar = [401, 403].includes(e.status) || /API key/i.test(e.message);
        // anahtar, kota ya da "model kullanılamıyor" hatasında aynı modelin diğer yollarını denemek anlamsız
        if (anahtar || e.status === 429 || /no longer available|is not found/i.test(e.message)) break;
      }
    }
    throw Object.assign(new Error(id + ' → ' + hata.join(' | ')), {anahtar});
  };
  const cur = {id: localStorage.diyetGemModel || GEM_MODEL, ver: localStorage.diyetGemVer || 'v1beta'};
  try { return await dene(cur); }
  catch (e) {
    if (e.anahtar) throw e;
    // Seçili model çalışmıyor (kaldırılmış, yeni kullanıcılara kapalı ya da kotası yok): listedeki Flash modelleri yeniden eskiye denenir, çalışan kaydedilir.
    let L = []; try { L = JSON.parse(localStorage.diyetGemList) || []; } catch {}
    if (!L.length) { L = await gemModeller().catch(() => []); localStorage.diyetGemList = JSON.stringify(L); }
    for (const m of L.filter(m => m.id !== cur.id && /flash/.test(m.id)).sort((a, b) => b.id.localeCompare(a.id, undefined, {numeric: true})).slice(0, 8)) {
      try { const r = await dene(m); localStorage.diyetGemModel = m.id; localStorage.diyetGemVer = m.ver; return {...r, model: m.id}; }
      catch (x) { if (x.anahtar) throw x; }
    }
    throw e;
  }
}

    <line id="cross" y1="${T}" y2="${H - B}" stroke="var(--axis)" style="display:none"/>
    ${pts.map(p => `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="3.5" fill="var(--ink2)"/>`).join('')}
    <polyline points="${pts.map(p => x(p[0]).toFixed(1) + ',' + y(p[2]).toFixed(1)).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${last ? `<circle cx="${x(last[0])}" cy="${y(last[2])}" r="5" fill="var(--acc)" stroke="var(--surface)" stroke-width="2"/>
      <text x="${x(last[0]) + 9}" y="${y(last[1]) - 8}" fill="var(--ink)" font-size="12" font-weight="600">${fmt(last[1], 2)}</text>` : ''}</svg>`;
  const wrap = h('div', {className: 'chart', innerHTML: svg}), tip = h('div', {className: 'tip', hidden: true}), cross = wrap.querySelector('#cross');
  wrap.append(tip);
  const move = e => {
    if (!pts.length) return;
    const r = wrap.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W;
    const p = pts.reduce((a, b) => Math.abs(x(b[0]) - px) < Math.abs(x(a[0]) - px) ? b : a), cx = x(p[0]);
    cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.style.display = '';
    tip.hidden = false;
    tip.replaceChildren(h('b', {}, dateOf(p[0]).toLocaleDateString(TR, {day: 'numeric', month: 'long'})),
      h('div', {}, `Tartı: ${fmt(p[1], 2)} kg`), h('div', {}, `7 gün ort.: ${fmt(p[2])} kg`), h('div', {}, `Plan: ${fmt(planKg(p[0]))} kg`));
    const tx = cx / W * r.width; tip.style.left = (tx > r.width / 2 ? tx - 166 : tx + 10) + 'px';
  };
  wrap.onpointermove = wrap.onpointerdown = move;
  wrap.onpointerleave = () => { tip.hidden = true; cross.style.display = 'none'; };
  return h('section', {}, h('h2', {}, 'Grafik'),
    h('div', {className: 'legend', innerHTML: `<span><i style="width:16px;height:2px;background:var(--acc)"></i>7 günlük ortalama</span>
      <span><i style="width:7px;height:7px;border-radius:50%;background:var(--ink2)"></i>Günlük tartı</span>
      <span><i style="width:16px;height:2px;background:var(--axis)"></i>Hedef planı</span>`}),
    wrap, pts.length ? null : h('p', {className: 'mut'}, 'Henüz kilo girişi yok. Bugün sekmesinden sabah kilonu gir.'),
    h('details', {style: 'margin-top:12px;padding-bottom:0'}, h('summary', {}, 'Tablo olarak göster'),
      h('table', {}, h('tr', {}, h('th', {}, 'Tarih'), h('th', {}, 'Tartı'), h('th', {}, '7 gün ort.'), h('th', {}, 'Plan')),
        pts.slice().reverse().map(p => h('tr', {}, h('td', {}, dateOf(p[0]).toLocaleDateString(TR, {day: 'numeric', month: 'short'})), h('td', {}, fmt(p[1], 2)), h('td', {}, fmt(p[2])), h('td', {}, fmt(planKg(p[0]))))))));
}
function weekStats() {
  const ds = Array.from({length: 7}, (_, i) => S.days[addDays(TODAY, -i)]).filter(Boolean);
  const food = ds.map(totals).filter(t => t.kcal > 0), kc = mean(food.map(t => t.kcal)), pr = mean(food.map(t => t.p)), ad = mean(ds.filter(d => d.adim).map(d => d.adim));
  const hedefGun = plan().hafta.filter(k => k !== 'yok').length;
  return h('section', {}, h('h2', {}, 'Son 7 gün', h('small', {}, food.length + ' gün yemek kaydı')), h('div', {className: 'tiles two'},
    tile('Ortalama kalori', kc == null ? '–' : Math.round(kc) + ' kcal', `hedef ${C.kcal}`),
    tile('Ortalama protein', pr == null ? '–' : Math.round(pr) + ' g', `hedef ${C.p}`),
    tile('Antrenman', ds.filter(d => d.sporOk).length + ' / ' + hedefGun, 'tamamlanan / planlanan'),
    tile('Ortalama adım', ad == null ? '–' : Math.round(ad).toLocaleString(TR), 'hedef ' + C.adim.toLocaleString(TR))));
}
function report() {
  const lines = [], P = plan();
  for (let i = 13; i >= 0; i--) {
    const t = addDays(TODAY, -i), d = S.days[t]; if (!d) continue;
    const s = totals(d), ne = [...Object.values(d.meals || {}).map(id => OPS[id]?.ad), ...(d.extra || []).map(x => x.ad)].filter(Boolean).join(', ');
    lines.push(`${t} | ${d.kg ?? '-'} kg |${d.kt ? ' kahvaltı ' + d.kt + ' |' : ''} ${s.kcal} kcal | ${s.p} g protein | su ${d.su || 0} ml | adım ${d.adim ?? '-'} | spor ${d.sporOk ? P.spor[d.spor]?.ad || 'yapıldı' : 'yok'}${d.bel ? ' | bel ' + d.bel + ' cm' : ''} | ${ne}`);
  }
  return `Son 14 gün (hedef ${C.kcal} kcal, ${C.p} g protein, ${C.goalKg} kg):\n` + (lines.join('\n') || 'kayıt yok');
}
function reportSection() {
  const out = h('pre', {hidden: true, tabIndex: 0});
  return h('section', {}, h('h2', {}, "Claude'a gönder"), h('p', {className: 'mut', style: 'margin:0 0 12px'}, 'Son 14 günün özetini kopyalar. Konuşmaya yapıştır, gidişatı ve tıkanmayı oradan yorumlarız.'),
    h('button', {className: 'btn pri', onclick: async () => {
      out.textContent = report(); out.hidden = false;
      try { await navigator.clipboard.writeText(out.textContent); status('✓ Özet kopyalandı'); } catch { getSelection().selectAllChildren(out); }
    }}, 'Özeti kopyala'), out);
}

/* ---------- Ayarlar ---------- */
function keySection() {
  const pk = h('input', {className: 'field', ariaLabel: 'Profil kodu', autocomplete: 'off', autocapitalize: 'off', spellcheck: false, value: kod(), style: 'flex:1 1 100%'});
  const key = h('input', {className: 'field', type: 'password', placeholder: 'JSONBin anahtarı (isteğe bağlı)', ariaLabel: 'JSONBin anahtarı', autocomplete: 'off', value: localStorage.diyetKey || '', style: 'flex:1 1 100%'});
  const bin = h('input', {className: 'field', placeholder: 'Kutu kimliği: ' + BIN, ariaLabel: 'JSONBin kutu kimliği', autocomplete: 'off', autocapitalize: 'off', spellcheck: false, value: localStorage.diyetBin || '', style: 'flex:1 1 100%'});
  return h('section', {}, h('h2', {}, 'Eşitleme'),
    h('p', {className: 'mut', style: 'margin:0 0 12px'}, 'Kayıtların bu profil koduyla saklanır; kodu bilmeyen biri onları sayfada göremez. Başka bir cihazında aynı kayıtları görmek için o cihaza bu kodu yaz. Kodu kimseyle paylaşma.'),
    h('label', {className: 'mut'}, 'Profil kodu'), h('div', {className: 'row', style: 'margin-top:4px'}, pk, key, bin, h('button', {className: 'btn pri', onclick: () => {
      if (pk.value.trim().length < 6) return status('Profil kodu en az 6 karakter olmalı');
      localStorage.diyetKod = pk.value.trim();
      key.value.trim() ? localStorage.diyetKey = key.value.trim() : localStorage.removeItem('diyetKey');
      bin.value.trim() ? localStorage.diyetBin = bin.value.trim() : localStorage.removeItem('diyetBin'); localStorage.diyetDirty = '1'; load();
    }}, 'Kaydet')));
}
function yedekSection() {
  const ta = h('textarea', {className: 'field', rows: 3, placeholder: 'Yedeği buraya yapıştır', ariaLabel: 'Yedek'}), ok = h('p', {className: 'mut', role: 'status'});
  return h('section', {}, h('h2', {}, 'Yedek'),
    h('p', {className: 'mut', style: 'margin:0 0 12px'}, 'Kayıtlar bu cihazın tarayıcısında durur. Ana ekrandaki kısayolu silmek ya da site verilerini temizlemek onları da siler; önce yedeği kopyalayıp Notlar’a yapıştır.'),
    ta, h('div', {className: 'row', style: 'margin-top:8px'},
      h('button', {className: 'btn pri', onclick: async () => {
        ta.value = JSON.stringify(S); ta.select();
        try { await navigator.clipboard.writeText(ta.value); ok.textContent = '✓ Yedek kopyalandı'; } catch { ok.textContent = 'Kutudaki metni elle kopyala.'; }
      }}, 'Yedeği kopyala'),
      h('button', {className: 'btn', onclick: () => {
        try { const r = JSON.parse(ta.value); if (!r.days) throw 0; merge(r, false); save(); ok.textContent = '✓ Yedek yüklendi'; }
        catch { ok.textContent = 'Bu metin geçerli bir yedek değil.'; }
      }}, 'Yedekten yükle'),
      h('button', {className: 'btn', onclick: () => {
        if (!confirm('Bu profildeki tüm kayıtlar hem bu cihazdan hem kutudan silinecek. Geri alınamaz. Devam edilsin mi?')) return;
        clearTimeout(timer); S = {days: {}}; applyCfg(); localStorage.diyet = JSON.stringify(S); push(false); render();
      }}, 'Tüm kayıtlarımı sil')), ok);
}
function gemSection() {
  const key = h('input', {className: 'field', type: 'password', placeholder: 'Gemini API anahtarı', ariaLabel: 'Gemini API anahtarı', autocomplete: 'off', value: localStorage.diyetGem || '', style: 'flex:1 1 100%'});
  const model = h('select', {className: 'field', ariaLabel: 'Gemini modeli', style: 'flex:1;min-width:0'}), ok = h('p', {className: 'mut', role: 'status', style: 'margin:8px 0 0'});
  const kaydetKey = () => key.value.trim() ? localStorage.diyetGem = key.value.trim() : localStorage.removeItem('diyetGem');
  const doldur = () => {
    let L = []; try { L = JSON.parse(localStorage.diyetGemList) || []; } catch {}
    const cur = localStorage.diyetGemModel || GEM_MODEL;
    if (!L.some(m => m.id === cur)) L.unshift({id: cur, ver: localStorage.diyetGemVer || 'v1beta', ad: cur});
    model.replaceChildren(...L.map(m => Object.assign(h('option', {value: m.id, selected: m.id === cur}, `${m.ad} (${m.id}, ${m.ver})`), {ver: m.ver})));
  };
  doldur();
  return h('section', {}, h('h2', {}, 'Gemini ile kalori tahmini'),
    h('p', {className: 'mut', style: 'margin:0 0 12px'}, 'Anahtarı aistudio.google.com adresinden ücretsiz alabilirsin. Anahtarı yaz, "Modelleri getir" ile anahtarının kullanabildiği modelleri listele, birini seçip kaydet. Anahtar yalnızca bu cihazda saklanır. Yazdığın metin ve seçtiğin fotoğraf Google’a gönderilir.'),
    h('div', {className: 'row'}, key, model,
      h('button', {className: 'btn', onclick: async () => {
        kaydetKey(); if (!localStorage.diyetGem) return ok.textContent = 'Önce anahtarı yaz.';
        ok.textContent = 'Modeller getiriliyor…';
        try { const L = await gemModeller(); localStorage.diyetGemList = JSON.stringify(L); doldur(); ok.textContent = L.length + ' model bulundu. Birini seçip "Kaydet"e bas.'; }
        catch (e) { ok.textContent = 'Modeller alınamadı: ' + (e.message || e); }
      }}, 'Modelleri getir'),
      h('button', {className: 'btn pri', onclick: () => {
        kaydetKey(); localStorage.diyetGemModel = model.value; localStorage.diyetGemVer = model.selectedOptions[0]?.ver || 'v1beta';
        ok.textContent = (localStorage.diyetGem ? '✓ Kaydedildi' : 'Anahtar silindi') + ', model: ' + model.value;
      }}, 'Kaydet')), ok);
}
function hedefSection() {
  const F = [['kcal', 'Günlük kalori (kcal)'], ['p', 'Günlük protein (g)'], ['su', 'Günlük su (ml)'], ['adim', 'Günlük adım'], ['startKg', 'Başlangıç kilosu (kg)'], ['start', 'Başlangıç tarihi', 'date'],
    ['goalKg', 'Hedef kilo (kg)'], ['goal', 'Hedef tarihi', 'date'], ['son', 'Ana öğün en geç', 'time']];
  const ins = F.map(([k, ad, type]) => h('input', {className: 'field', ariaLabel: ad, style: 'width:9.5em;text-align:right', ...(type ? {type, value: C[k]} : {inputMode: 'decimal', value: String(C[k]).replace('.', ',')})}));
  const ok = h('p', {className: 'mut', role: 'status'});
  return h('section', {}, h('h2', {}, 'Hedefler'),
    h('ul', {className: 'list'}, F.map(([, ad], i) => h('li', {}, h('span', {}, ad), ins[i]))),
    h('div', {className: 'row', style: 'margin-top:12px'},
      h('button', {className: 'btn pri', onclick: () => {
        const n = {};
        for (const [i, [k, ad, type]] of F.entries()) { n[k] = type ? ins[i].value : sayi(ins[i].value); if (!n[k]) return ok.textContent = ad + ' geçersiz.'; }
        if (n.goal <= n.start) return ok.textContent = 'Hedef tarihi başlangıçtan sonra olmalı.';
        S.cfg = {...n, at: Date.now()}; applyCfg(); save(); ok.textContent = '✓ Kaydedildi';
      }}, 'Kaydet'),
      h('button', {className: 'btn', onclick: () => { S.cfg = {at: Date.now()}; applyCfg(); save(); render(); }}, 'Varsayılana dön')), ok);
}

/* ---------- Çatı ---------- */
const TABS = [
  ['bugun', 'Bugün', '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/>'],
  ['spor', 'Spor', '<path d="M3.5 9.5v5M6.5 7v10M17.5 7v10M20.5 9.5v5M6.5 12h11"/>'],
  ['gidisat', 'Gidişat', '<path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/>'],
  ['ayar', 'Ayarlar', '<path d="M4 7h8M18 7h2M4 17h2M12 17h8"/><circle cx="15" cy="7" r="2.5"/><circle cx="9" cy="17" r="2.5"/>']
];
const VIEWS = {
  bugun: () => [hero(), olcum(), extraSection()],
  spor: () => [sporToday(), sporPlan()],
  gidisat: () => [tiles(), chartSection(), weekStats(), reportSection()],
  ayar: () => [keySection(), yedekSection(), gemSection(), hedefSection()]
};
const BUILD = {ozet: hero, ekstra: extraSection, sporBugun: sporToday, sporPlan};
const re = id => $(id)?.replaceWith(BUILD[id]());
const hasData = d => d && (d.kg || d.sporOk || totals(d).kcal > 0);

function renderHead() {
  const daily = tab === 'bugun' || tab === 'spor';
  $('title').textContent = daily ? (cur === TODAY ? 'Bugün, ' : '') + dateOf(cur).toLocaleDateString(TR, {day: 'numeric', month: 'long', weekday: 'long'}) : TABS.find(t => t[0] === tab)[1];
  $('today').hidden = !daily || cur === TODAY;
  $('week').hidden = !daily;
  const m = monday(cur), go = t => () => { cur = t; render(); };
  $('week').replaceChildren(
    h('button', {className: 'arr', ariaLabel: 'Önceki hafta', onclick: go(addDays(cur, -7))}, '‹'),
    ...Array.from({length: 7}, (_, i) => {
      const t = addDays(m, i), d = dateOf(t);
      return h('button', {className: (t === cur ? 'on' : '') + (t === TODAY ? ' now' : ''), ariaLabel: d.toLocaleDateString(TR, {day: 'numeric', month: 'long', weekday: 'long'}), ariaCurrent: t === cur ? 'date' : null, onclick: go(t)},
        h('span', {}, ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'][d.getDay()]), h('b', {}, d.getDate()), h('i', {className: hasData(S.days[t]) ? 'dot' : ''}));
    }),
    h('button', {className: 'arr', ariaLabel: 'Sonraki hafta', onclick: go(addDays(cur, 7))}, '›'));
}
function render() {
  renderHead();
  $('tabs').replaceChildren(...TABS.map(([id, ad, icon]) => h('button', {ariaCurrent: tab === id ? 'page' : null, onclick: () => { tab = id; render(); scrollTo(0, 0); },
    innerHTML: `<svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg><span>${ad}</span>`})));
  $('app').replaceChildren(...VIEWS[tab]());
}
$('today').onclick = () => { cur = TODAY; render(); };
load();
</script>
